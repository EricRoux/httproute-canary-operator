# This rule is not used by the project kub-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to core.argo-rollout.canary.controller.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kub-controller
    app.kubernetes.io/managed-by: kustomize
  name: customhttprouteconfig-viewer-role
rules:
- apiGroups:
  - core.argo-rollout.canary.controller.io
  resources:
  - customhttprouteconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - core.argo-rollout.canary.controller.io
  resources:
  - customhttprouteconfigs/status
  verbs:
  - get
