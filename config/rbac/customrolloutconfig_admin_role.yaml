# This rule is not used by the project kub-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over core.argo-rollout.canary.controller.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kub-controller
    app.kubernetes.io/managed-by: kustomize
  name: customrolloutconfig-admin-role
rules:
- apiGroups:
  - core.argo-rollout.canary.controller.io
  resources:
  - customrolloutconfigs
  verbs:
  - '*'
- apiGroups:
  - core.argo-rollout.canary.controller.io
  resources:
  - customrolloutconfigs/status
  verbs:
  - get
