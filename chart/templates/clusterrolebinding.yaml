{{- if .Values.clusterRole.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "httproute-canary-operator.clusterRoleBindingName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "httproute-canary-operator.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "httproute-canary-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}